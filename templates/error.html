<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error — HealthCare</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plh7eecyn6CflLstUkEbRlCg3UF8A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="logo">
      <i class="fa-solid fa-heart-pulse" aria-hidden="true"></i>
      <span>HealthCare</span>
    </div>
  </div>
</header>

<main class="container main-content">
  <div class="error-page" role="alert">
    <div class="error-icon" aria-hidden="true">
      <i class="fa-solid fa-circle-exclamation"></i>
    </div>
    <h1 class="error-title">{{ title }}</h1>
    <p class="error-message">{{ message }}</p>

    {% if errors %}
    <ul class="error-list">
      {% for err in errors %}
      <li><i class="fa-solid fa-xmark" aria-hidden="true"></i> {{ err }}</li>
      {% endfor %}
    </ul>
    {% endif %}

    <div class="error-actions">
      <a href="/" class="btn btn-primary">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Home
      </a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-copy">&copy; 2025 HealthCare</p>
  </div>
</footer>

</body>
</html>
